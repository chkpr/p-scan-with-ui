<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Scanner</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
	rel="stylesheet">
</head>

<body>
	<header>
		<div class="logo">p-scan</div>
	</header>

	<main>
		<section class="scanner">
			<div class="scanner-box">
				<h1>Configure Scan</h1>
				<form id="scan-form">
					<ul>
						<li><label for="host">Host</label><br> <input
							type="text" id="host" name="scan_host" placeholder="Ex: scanme.nmap.org" autocomplete="off"/></li>

						<li><label for="portsRange">Ports range</label><br> <input
							type="text" id="portsRange" name="scan_portsRange" placeholder="Ex: 0-1024" autocomplete="off"/></li>

						<li><label for="threads">Threads</label><br> <input
							type="text" id="threads" name="scan_threads" placeholder="Ex: 50 (leave empty for default value)" autocomplete="off"></li>
					</ul>
					<button>Start scanning</button>
					<button type="button" id="stop-button">Stop scan</button>
					<button type="button" onclick="resetForm()" >Reset form fields</button>
				</form>
			</div>
		</section>
		<section class="scan-results">
			<div class="results-header">Scan results</div>
			<div id="results-content">
				<p class="placeholder">No scan results yet.</p>
			</div>
		</section>
	</main>

	<footer>
		<div class="footer">© 2026 P-SCAN</div>
	</footer>

<script>
document.getElementById('scan-form').addEventListener('submit', function(e) {
	e.preventDefault();
	const host = document.getElementById('host').value;
	const range = document.getElementById('portsRange').value.split('-');
	const threads = document.getElementById('threads').value || 20;
	const startPort = range[0] || 1;
	const endPort = range[1] || 1024;
	
	document.getElementById('results-content').innerHTML = '<p class="placeholder">Scanning...</p>';	
	
	 fetch(`/api/scan?host=${host}&startPort=${startPort}&endPort=${endPort}&threads=${threads}&timeoutMs=500`)
		.then(r=> r.json())
		.then(data => {
			if (data.length === 0) {
				document.getElementById('results-content').innerHtml='<p class="placeholder">No open ports found.</p>';
			} else {
				const rows = data.map(r =>
					`<div class="result-row">
						<span class="port">Port ${r.port}</span>
						<span class="service">${r.service}</span>
						<span class="time">${r.responseTime}ms</span>
					</div>`
				).join('');
				document.getElementById('results-content').innerHTML = rows;
			}
		})
		.catch(() => {
			document.getElementById('results-content').innerHTML = '<p class="placeholder">Error during scan.</p>';
		});
		
	});
	

document.getElementById('stop-button').addEventListener('click', function(){
	fetch(`/api/stop`);
	document.getElementById('results-content').innerHTML = '<p class="placeholder">Scan stopped.</p>';
});


	function resetForm() {
	  document.getElementById("scan-form").reset();
	}
	
	
</script>

</body>
</html>
